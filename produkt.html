<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Produkt</title>
  <meta name="theme-color" content="#1b1917">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=19">
  <link rel="stylesheet" href="assets/css/home.css?v=19">
  <link rel="stylesheet" href="assets/css/produkt.css?v=19">
</head>
<body class="home">
  <a class="skip-link" href="#tresc">Przejdź do treści</a>

  <!-- ================= NAGŁÓWEK (wspólny) ================= -->
  <header class="hdr">
    <div class="hdr__inner shell">
      <a class="hdr__logo" href="index.html" data-brand>&nbsp;</a>

      <nav class="hdr__nav" aria-label="Główne">
        <ul data-nav></ul>
      </nav>


      <div class="hdr__actions">
        <button class="hdr__act" type="button" data-cart-open>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
          <span>Koszyk</span>
          <em class="hdr__count is-pusty" data-cart-count>0</em>
        </button>
        <button class="hdr__burger" type="button" data-burger aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="tresc">
    <div class="shell">

      <nav class="crumbs" aria-label="Ścieżka">
        <a href="index.html">Strona główna</a>
        <span aria-hidden="true">/</span>
        <a data-crumb-scene href="#"></a>
        <span aria-hidden="true">/</span>
        <span data-crumb-product aria-current="page"></span>
      </nav>

      <p class="pr__ladowanie" data-loading>Wczytywanie produktu…</p>

      <!-- ================= PRODUKT — MOZAIKA =================
           Kafle układa CSS Grid z gęstym pakowaniem, więc gdy produkt
           ma mniej zdjęć, dziury same się domykają. -->
      <article class="bento" data-produkt hidden>
        <div class="bento__grid" data-bento-grid>

        <!-- duże zdjęcie z nazwą na dole -->
        <div class="bt bt--hero" data-bt-hero>
          <img class="bt__img" data-pr-img alt="">
          <div class="bt__pusto" data-pr-pusto hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5-6 6"/>
            </svg>
            <p>Ten produkt nie ma jeszcze zdjęć</p>
            <p class="bt__pusto-sub">Dodasz je w panelu</p>
          </div>

          <div class="bt__hero-tekst">
            <p class="bt__brand" data-pr-brand></p>
            <h1 class="bt__name" data-pr-name></h1>
          </div>

          <button class="bt__arrow bt__arrow--prev" type="button" data-pr-prev aria-label="Poprzednie zdjęcie">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="bt__arrow bt__arrow--next" type="button" data-pr-next aria-label="Następne zdjęcie">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <span class="bt__licznik" data-pr-licznik hidden></span>
        </div>

        <!-- dlaczego polecamy -->
        <div class="bt bt--tekst bt--why">
          <p class="bt__label">Dlaczego polecamy</p>
          <p class="bt__tresc" data-pr-why></p>
        </div>

        <!-- pozostałe zdjęcia — dorzuca je JS -->
        <div class="bt bt--foto" data-bt-foto-1 hidden><img class="bt__img" alt=""></div>
        <div class="bt bt--foto" data-bt-foto-2 hidden><img class="bt__img" alt=""></div>

        <!-- parametry -->
        <div class="bt bt--tekst bt--specs" data-bt-specs hidden>
          <p class="bt__label">Parametry</p>
          <ul class="bt__specs" data-pr-specs></ul>
        </div>

        <!-- cena i koszyk -->
        <div class="bt bt--kup">
          <div class="bt__kup-gora">
            <p class="bt__label">Cena</p>
            <p class="bt__cena" data-pr-price></p>
          </div>
          <button class="bt__dokoszyka" type="button" data-do-koszyka>
            <span>Dodaj do koszyka</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
          </button>
          <p class="bt__kup-nota" data-pr-note></p>
        </div>

        </div><!-- /.bento__grid -->

        <!-- nawigacja między produktami sceny -->
        <div class="bt--nav">
          <a class="bt__nav-btn" data-pr-back href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            <span data-pr-back-label>Wróć do zdjęcia</span>
          </a>
          <a class="bt__nav-btn" data-nav-prev href="#">Poprzedni</a>
          <a class="bt__nav-btn" data-nav-next href="#">Następny</a>
        </div>

        <div class="bt__thumbs" data-pr-thumbs></div>
      </article>

      <!-- ================= POZOSTAŁE Z TEJ SCENY ================= -->
      <section class="block" data-inne hidden>
        <div class="block__head">
          <h2 class="block__title">Reszta z tego zdjęcia</h2>
          <a class="block__more" data-inne-all href="#">Zobacz całą scenę</a>
        </div>
        <ul class="prods" data-inne-list></ul>
      </section>

    </div>
  </main>

  <footer class="ftr">
    <div class="shell ftr__inner" data-footer></div>
  </footer>

  <!-- Menu mobilne -->
  <div class="mnav__scrim" data-mnav-scrim hidden></div>
  <nav class="mnav" data-mnav hidden aria-label="Menu mobilne">
    <button class="mnav__close" type="button" data-mnav-close aria-label="Zamknij">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <ul data-mnav-list></ul>
  </nav>

  <script src="assets/js/produkt.js?v=19" type="module"></script>
</body>
</html>
