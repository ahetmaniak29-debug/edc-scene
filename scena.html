<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kategoria</title>
  <meta name="description" content="Wyselekcjonowany sprzęt na jednym zdjęciu. Dotknij przedmiotu, żeby zobaczyć szczegóły.">
  <meta name="theme-color" content="#f7f4ee">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body class="home">
  <a class="skip-link" href="#tresc">Przejdź do treści</a>

  <!-- ================= NAGŁÓWEK (wspólny ze stroną główną) ================= -->
  <header class="hdr">
    <div class="hdr__inner shell">
      <a class="hdr__logo" href="index.html" data-brand>&nbsp;</a>

      <nav class="hdr__nav" aria-label="Główne">
        <ul data-nav></ul>
      </nav>

      <form class="hdr__search" role="search" onsubmit="return false">
        <input type="search" data-search aria-label="Szukaj">
        <button type="submit" aria-label="Szukaj">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </form>

      <div class="hdr__actions">
        <a class="hdr__act" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span>Konto</span>
        </a>
        <a class="hdr__act" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-4.9-8-10a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.1-8 10-8 10z"/></svg>
          <span>Ulubione</span>
          <em class="hdr__count">0</em>
        </a>
        <a class="hdr__act" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
          <span>Koszyk</span>
          <em class="hdr__count">0</em>
        </a>
        <button class="hdr__burger" type="button" data-burger aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="tresc">
    <div class="shell">

      <nav class="crumbs" aria-label="Ścieżka">
        <a href="index.html">Strona główna</a>
        <span aria-hidden="true">/</span>
        <span data-crumb aria-current="page"></span>
      </nav>

      <section class="chead">
        <p class="chead__kicker" data-scene-label hidden></p>
        <h1 class="chead__title" data-scene-title>&nbsp;</h1>
        <p class="chead__sub" data-scene-subtitle></p>
      </section>

      <!-- ================= DUŻE ZDJĘCIE ================= -->
      <!-- Punkty są pozycjonowane w % względem obrazka, więc trzymają się
           przedmiotów niezależnie od wielkości ekranu. Panel produktu wysuwa się
           w środku kadru — po stronie przeciwnej do klikniętego punktu, żeby go
           nie zasłaniać. -->
      <section class="stage" aria-label="Scena z przedmiotami">
        <div class="stage__frame" data-stage>
          <img class="stage__img" data-scene-img alt="" decoding="async">
          <div class="stage__hotspots" data-hotspots></div>
          <div class="stage__loading" data-stage-loading>Wczytywanie sceny…</div>

          <!-- Panel produktu — szkło -->
          <aside class="glass" data-sheet hidden aria-modal="true" role="dialog" aria-labelledby="sheet-name">
            <div class="glass__grip" data-sheet-grip><span></span></div>
            <button class="glass__close" data-sheet-close type="button" aria-label="Zamknij">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>

            <div class="glass__body">
              <p class="glass__brand" data-sheet-brand></p>
              <h2 class="glass__name" id="sheet-name" data-sheet-name></h2>
              <p class="glass__price" data-sheet-price></p>

              <div class="glass__why">
                <p class="glass__why-label">Dlaczego polecamy</p>
                <p class="glass__why-text" data-sheet-why></p>
              </div>

              <ul class="glass__specs" data-sheet-specs hidden></ul>
            </div>

            <div class="glass__cta">
              <a class="btn" data-sheet-link target="_blank" rel="noopener noreferrer">
                <span data-sheet-cta>Zobacz u sprzedawcy</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
              </a>
              <p class="glass__note" data-sheet-note></p>
            </div>
          </aside>
        </div>

        <p class="stage__hint" data-stage-hint hidden>
          <span class="stage__hint-dot" aria-hidden="true"></span>
          Dotknij numeru, żeby zobaczyć przedmiot
        </p>
      </section>

      <!-- ================= MNIEJSZA KARUZELA POD ZDJĘCIEM ================= -->
      <section class="gal" data-gallery hidden aria-label="Więcej ujęć" aria-roledescription="carousel">
        <div class="gal__frame">
          <div class="gal__track" data-gal-track></div>

          <button class="gal__arrow gal__arrow--prev" type="button" data-gal-prev aria-label="Poprzednie zdjęcie">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="gal__arrow gal__arrow--next" type="button" data-gal-next aria-label="Następne zdjęcie">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div class="gal__dots" data-gal-dots role="tablist" aria-label="Wybór zdjęcia"></div>
      </section>

      <!-- Lista tekstowa: to samo, co punkty na zdjęciu. Zwijana, żeby nie
           przytłaczała zdjęcia — <details> działa też bez JS i z klawiatury. -->
      <section id="lista">
        <details class="fold">
          <summary class="fold__head">
            <h2 class="fold__title">Wszystko na tym zdjęciu</h2>
            <span class="fold__count" data-list-count></span>
            <span class="fold__chev" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </summary>
          <ul class="list__items" data-product-list></ul>
        </details>
      </section>

      <section class="trust" aria-label="Nasze zasady">
        <ul class="trust__list" data-trust></ul>
      </section>

      <p class="stage__note" data-foot-note></p>

    </div>
  </main>

  <footer class="ftr">
    <div class="shell ftr__inner" data-footer></div>
  </footer>

  <!-- Przyciemnienie tła — tylko na telefonie, gdzie panel jest wysuwany z dołu -->
  <div class="scrim" data-scrim hidden></div>

  <!-- Widok statystyk (?stats=1) -->
  <section class="stats" data-stats hidden></section>

  <!-- Menu mobilne -->
  <div class="mnav__scrim" data-mnav-scrim hidden></div>
  <nav class="mnav" data-mnav hidden aria-label="Menu mobilne">
    <button class="mnav__close" type="button" data-mnav-close aria-label="Zamknij">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <ul data-mnav-list></ul>
  </nav>

  <script src="assets/js/app.js" type="module"></script>
</body>
</html>
