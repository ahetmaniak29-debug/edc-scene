<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>eStoro</title>
  <meta name="description" content="eStoro — sklep, w którym rzeczy pokazujemy tam, gdzie stoją: na zdjęciach wnętrz i wystaw.">
  <meta name="theme-color" content="#1b1917">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=40">
  <link rel="stylesheet" href="assets/css/home.css?v=40">
  <link rel="stylesheet" href="assets/css/produkt.css?v=40">
</head>
<body class="home">
  <a class="skip-link" href="#tresc">Przejdź do treści</a>

  <!-- ================= NAGŁÓWEK ================= -->
  <header class="hdr">
    <div class="hdr__inner shell">
      <a class="hdr__logo" href="index.html" data-brand>&nbsp;</a>

      <nav class="hdr__nav" aria-label="Główne">
        <ul data-nav></ul>
      </nav>

      <div class="hdr__actions">
        <button class="hdr__act" type="button" data-cart-open>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
          <span>Koszyk</span>
          <em class="hdr__count is-pusty" data-cart-count>0</em>
        </button>
        <button class="hdr__burger" type="button" data-burger aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="tresc">
    <div class="shell">

      <!-- ================= ŚCIANA (pierwszy ekran) =================
           Hero, kategorie i kafelki leżą w jednej siatce — sekcje są
           dla układu przezroczyste, kaflami są ich elementy. -->
      <div class="sciana">

        <section class="hero" aria-label="Wyróżnione" aria-roledescription="carousel">
          <div class="hero__track" data-hero-track></div>

          <button class="hero__arrow hero__arrow--prev" type="button" data-hero-prev aria-label="Poprzedni slajd">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="hero__arrow hero__arrow--next" type="button" data-hero-next aria-label="Następny slajd">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>

          <div class="hero__dots" data-hero-dots role="tablist" aria-label="Wybór slajdu"></div>
        </section>

        <section class="cats" aria-labelledby="cats-h">
          <h2 class="sr-only" id="cats-h">Kategorie</h2>
          <ul class="cats__list" data-cats></ul>
        </section>

        <section class="tiles" aria-label="Wyróżnione sekcje">
          <div class="tiles__grid" data-tiles></div>
        </section>

      </div>

      <!-- ================= KOLEKCJE ================= -->
      <section class="block" aria-labelledby="coll-h">
        <div class="block__head">
          <h2 class="block__title" id="coll-h" data-collections-title></h2>
          <a class="block__more" href="#" data-collections-all></a>
        </div>
        <div class="colls" data-collections></div>
      </section>

      <!-- ================= PRODUKTY ================= -->
      <section class="block" aria-labelledby="prod-h">
        <div class="block__head">
          <h2 class="block__title" id="prod-h" data-products-title></h2>
          <a class="block__more" href="#" data-products-all></a>
        </div>
        <ul class="prods" data-products></ul>
      </section>

      <!-- ================= O NAS ================= -->
      <section class="about" data-about></section>

      <!-- ================= ZASADY I WARTOŚCI =================
           Drobny druk schodzi na dół — nad zdjęciami nie ma miejsca
           na paski z ikonkami. -->
      <section class="trust" aria-label="Nasze zasady">
        <ul class="trust__list" data-trust></ul>
      </section>

      <section class="vals" aria-label="Dlaczego my">
        <ul class="vals__list" data-values></ul>
      </section>

      <!-- ================= NEWSLETTER ================= -->
      <section class="news" data-newsletter></section>

    </div>
  </main>

  <!-- ================= STOPKA ================= -->
  <footer class="ftr">
    <div class="shell ftr__inner" data-footer></div>
  </footer>

  <!-- Menu mobilne -->
  <div class="mnav__scrim" data-mnav-scrim hidden></div>
  <nav class="mnav" data-mnav hidden aria-label="Menu mobilne">
    <button class="mnav__close" type="button" data-mnav-close aria-label="Zamknij">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <ul data-mnav-list></ul>
  </nav>

  <script src="assets/js/home.js?v=40" type="module"></script>
</body>
</html>
