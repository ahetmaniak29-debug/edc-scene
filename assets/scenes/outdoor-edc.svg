<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Stylizowana scena EDC">
  <!--
    ZDJĘCIE ZASTĘPCZE — układ knolling na jasnym tle.
    Podmień ten plik na własną fotografię (jpg/webp), zaktualizuj "image"
    w data/scenes/outdoor-edc.json i ustaw punkty przez ?pick=1.
  -->
  <defs>
    <linearGradient id="surface" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#f0ebe3"/>
      <stop offset="45%"  stop-color="#e6e0d6"/>
      <stop offset="100%" stop-color="#d9d2c7"/>
    </linearGradient>
    <radialGradient id="light" cx="34%" cy="16%" r="82%">
      <stop offset="0%"   stop-color="#fffdf9" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#fffdf9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b9b1a4" stop-opacity="0.34"/>
    </radialGradient>

    <linearGradient id="body" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#3c4046"/>
      <stop offset="55%"  stop-color="#2a2d33"/>
      <stop offset="100%" stop-color="#1d2025"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e4e8ed"/>
      <stop offset="42%"  stop-color="#b3bac3"/>
      <stop offset="100%" stop-color="#8b939e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#ff8a3d"/>
      <stop offset="60%"  stop-color="#f26522"/>
      <stop offset="100%" stop-color="#d24d13"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#fdfcfa"/>
      <stop offset="100%" stop-color="#e8e3da"/>
    </linearGradient>

    <!-- miękki cień jak przy zdjęciu w rozproszonym świetle -->
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="5" dy="11" stdDeviation="10" flood-color="#57503f" flood-opacity="0.30"/>
      <feDropShadow dx="1" dy="2"  stdDeviation="2"  flood-color="#57503f" flood-opacity="0.22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#surface)"/>
  <rect width="1000" height="1250" fill="url(#light)"/>

  <!-- Wszystkie przedmioty powiększone wokół środka kadru, żeby układ był gęstszy.
       Punkty w JSON są policzone dla tej skali. -->
  <g transform="translate(500 625) scale(1.1) translate(-500 -625)">

  <!-- 1. SCYZORYK  (22.5%, 17%) -->
  <g transform="translate(250 250)" filter="url(#drop)">
    <path d="M18 -19 L196 -14 Q224 -8 196 0 L18 6 Z" fill="url(#steel)"/>
    <path d="M30 -13 L178 -9 Q192 -6 178 -3 L30 0 Z" fill="#fff" opacity="0.45"/>
    <rect x="-200" y="-27" width="222" height="54" rx="25" fill="url(#body)"/>
    <rect x="-192" y="-21" width="196" height="13" rx="7" fill="#fff" opacity="0.13"/>
    <g stroke="#14161a" stroke-width="3.5" opacity="0.55">
      <path d="M-150 -20 V20 M-132 -20 V20 M-114 -20 V20 M-96 -20 V20 M-78 -20 V20 M-60 -20 V20"/>
    </g>
    <circle cx="4" cy="0" r="8.5" fill="#aeb6c0"/>
    <circle cx="-168" cy="0" r="6" fill="#8b939e"/>
    <path d="M-198 -17 q-20 8 0 16" fill="none" stroke="url(#orange)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 2. LATARKA  (72%, 20%) -->
  <g transform="translate(720 250)" filter="url(#drop)">
    <rect x="-30" y="-140" width="60" height="272" rx="15" fill="url(#body)"/>
    <rect x="-36" y="-148" width="72" height="36" rx="12" fill="#33373d"/>
    <circle cx="0" cy="-130" r="20" fill="#0f1114"/>
    <circle cx="0" cy="-130" r="12" fill="url(#steel)"/>
    <circle cx="-4" cy="-135" r="4.5" fill="#fff" opacity="0.85"/>
    <g stroke="#12141a" stroke-width="4.5" opacity="0.6">
      <path d="M-30 -58 H30 M-30 -38 H30 M-30 -18 H30 M-30 2 H30 M-30 22 H30 M-30 42 H30 M-30 62 H30"/>
    </g>
    <rect x="-23" y="-140" width="10" height="272" rx="5" fill="#fff" opacity="0.14"/>
    <rect x="-36" y="104" width="72" height="30" rx="11" fill="url(#orange)"/>
    <path d="M32 -84 q20 36 0 72" fill="none" stroke="#4a4f57" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 3. MULTITOOL  (25%, 48%) -->
  <g transform="translate(250 600)" filter="url(#drop)">
    <path d="M-118 -44 h196 q34 0 34 34 v20 q0 34 -34 34 h-196 q-18 0 -18 -18 v-52 q0 -18 18 -18 z" fill="url(#steel)"/>
    <path d="M-112 -37 h184 q24 0 24 24 v3 h-208 z" fill="#fff" opacity="0.5"/>
    <circle cx="74" cy="0" r="17" fill="#e6e0d6"/>
    <circle cx="74" cy="0" r="17" fill="none" stroke="#7d8590" stroke-width="3"/>
    <rect x="-88" y="-25" width="42" height="18" rx="3" fill="#e6e0d6"/>
    <rect x="-88" y="6"  width="42" height="18" rx="3" fill="#e6e0d6"/>
    <path d="M-22 -27 l34 0 l-10 54 l-24 0 z" fill="#e6e0d6"/>
    <path d="M24 -29 q22 29 0 58" fill="none" stroke="#e6e0d6" stroke-width="9"/>
    <path d="M-132 -9 q-16 9 0 18" fill="none" stroke="url(#orange)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 4. PORTFEL  (72%, 48%) -->
  <g transform="translate(720 600)" filter="url(#drop)">
    <rect x="-104" y="-78" width="188" height="118" rx="10" fill="url(#card)"/>
    <rect x="-112" y="-68" width="188" height="118" rx="10" fill="#f7f4ee"/>
    <rect x="-118" y="-58" width="236" height="128" rx="14" fill="url(#body)"/>
    <rect x="-118" y="-58" width="236" height="24" rx="12" fill="#fff" opacity="0.11"/>
    <rect x="-118" y="-8" width="236" height="16" rx="6" fill="#15171b"/>
    <rect x="-118" y="-5" width="236" height="6" fill="url(#orange)"/>
    <circle cx="0" cy="38" r="11" fill="url(#steel)"/>
    <circle cx="0" cy="38" r="4.5" fill="#22252a"/>
    <path d="M-84 56 h168" stroke="#0f1114" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- 5. NOTES + DŁUGOPIS  (27%, 78%) -->
  <g transform="translate(270 975)">
    <g filter="url(#drop)">
      <rect x="-112" y="-152" width="224" height="304" rx="9" fill="url(#body)"/>
      <rect x="-112" y="-152" width="224" height="52" rx="9" fill="url(#orange)"/>
      <rect x="-112" y="-108" width="224" height="8" fill="#c9450f" opacity="0.4"/>
      <g stroke="#4b5057" stroke-width="4.5" stroke-linecap="round">
        <path d="M-72 -46 H72 M-72 -12 H72 M-72 22 H36 M-72 56 H72 M-72 90 H12"/>
      </g>
      <rect x="-112" y="-152" width="18" height="304" fill="#000" opacity="0.24"/>
      <rect x="-100" y="-144" width="6" height="288" rx="3" fill="#fff" opacity="0.10"/>
    </g>
    <g transform="translate(154 8)" filter="url(#drop)">
      <rect x="-13" y="-140" width="26" height="280" rx="12" fill="url(#steel)"/>
      <path d="M-13 -140 q13 -30 26 0 z" fill="#8b939e"/>
      <rect x="-13" y="96" width="26" height="26" rx="8" fill="url(#orange)"/>
      <rect x="10" y="-118" width="9" height="76" rx="4" fill="#8b939e"/>
      <rect x="-8" y="-130" width="7" height="260" rx="3" fill="#fff" opacity="0.55"/>
    </g>
  </g>

  <!-- 6. ZEGAREK  (73%, 78%) -->
  <g transform="translate(730 975)" filter="url(#drop)">
    <path d="M-32 -72 q-7 -84 5 -116 h54 q12 32 5 116 z" fill="url(#body)"/>
    <path d="M-32 72 q-7 84 5 116 h54 q12 -32 5 -116 z" fill="url(#body)"/>
    <g stroke="#0f1114" stroke-width="3.5" opacity="0.55">
      <path d="M-29 -116 h58 M-30 -148 h60 M-29 116 h58 M-30 148 h60"/>
    </g>
    <circle cx="0" cy="0" r="80" fill="url(#steel)"/>
    <circle cx="0" cy="0" r="69" fill="#20242a"/>
    <circle cx="0" cy="0" r="63" fill="#161a1f"/>
    <g stroke="#e8ecf1" stroke-width="3.5" stroke-linecap="round">
      <path d="M0 -53 V-41 M0 53 V41 M-53 0 H-41 M53 0 H41"/>
    </g>
    <g stroke="#9aa2ad" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <path d="M37 -37 l-7 7 M-37 -37 l7 7 M37 37 l-7 -7 M-37 37 l7 -7"/>
    </g>
    <path d="M0 5 V-32" stroke="#f2f5f8" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 5 L36 27" stroke="#f2f5f8" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 12 L-22 -40" stroke="url(#orange)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="url(#orange)"/>
    <rect x="77" y="-11" width="15" height="22" rx="5" fill="#8b939e"/>
    <ellipse cx="-22" cy="-26" rx="26" ry="17" fill="#fff" opacity="0.07"/>
  </g>

  </g>

  <rect width="1000" height="1250" filter="url(#grain)" opacity="0.75"/>
</svg>
